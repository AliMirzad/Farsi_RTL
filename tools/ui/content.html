<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>content.js UI tests</title>
<style>
  body { font:16px/1.5 sans-serif; width:700px; }
  h2 { font-size:24px; }
  pre { font-size:13px; }
</style>
<script src="stub.js"></script>
</head>
<body>
  <!-- A stripped-down chat page: site chrome, an answer, and a composer. -->
  <nav><ul><li id="nav-li">گفتگوی قبلی درباره‌ی پایتون</li></ul></nav>
  <header><h1 id="head-h1">عنوان گفتگو</h1></header>
  <main>
    <div class="markdown">
      <p id="p1">این یک پاراگراف فارسی است که باید راست‌چین شود.</p>
      <h2 id="h2">عنوان فارسی</h2>
      <ul id="ul">
        <li id="li1"><p id="lip">مرحله‌ی اول نصب بسته است</p>
          <pre id="pre-in"><code>npm install farsi</code></pre></li>
      </ul>
      <pre id="pre"><code>const x = 1;</code></pre>
      <p id="en">This is a plain English paragraph with no Persian.</p>
      <p id="ov">این پاراگراف را کاربر دستی چپ‌چین کرده بود.</p>
    </div>
    <form><div contenteditable="true" id="composer"><p id="cp">سلام، این متن پیام من است</p></div></form>
  </main>

<script>
(async function () {
  const S = __stub;
  const $ = (id) => document.getElementById(id);
  const zoom = (id) => $(id).currentCSSZoom;
  const root = document.documentElement;
  const OV_TEXT = $("ov").textContent;

  // Same hash content.js keys overrides by (fnv-1a over the first 200 chars).
  function fnv(text, cap) {
    let h = 0x811c9dc5;
    const n = Math.min(text.length, cap);
    for (let i = 0; i < n; i++) { h ^= text.charCodeAt(i); h = Math.imul(h, 0x01000193); }
    return (h >>> 0).toString(36);
  }

  // A returning user: settings from before this feature (no fontScale),
  // and one saved manual flip.
  S.sync = { rtlMode: "smart", fontEnabled: true, lineSpacing: false, siteOff: {} };
  S.local = { overrides: { [fnv(OV_TEXT, 200)]: "ltr" } };

  try {
    await S.loadScript("../../engine.js");
    await S.loadScript("../../content.js");
    await S.wait(1200);

    await S.test("font size default is 100%", async () => {
      S.assert(!root.classList.contains("farsi-scale-on"), "scale class present at 100%");
      S.assert(!root.style.getPropertyValue("--farsi-scale"), "scale variable set at 100%");
      S.assert($("p1").getAttribute("data-farsi-rtl") === "rtl", "p1 not marked rtl");
      S.near(zoom("p1"), 1, "p1 zoom");
    });

    await S.test("old settings are untouched (backward compatibility)", async () => {
      S.assert(!("fontScale" in S.sync), "fontScale written without a user action");
      S.assert(S.sync.rtlMode === "smart" && S.sync.fontEnabled === true, "existing settings changed");
    });

    await S.test("live apply: message changes size without reload", async () => {
      const h0 = $("h2").getBoundingClientRect().height;
      S.send({ type: "farsi-toggle", fontScale: 120 });
      await S.wait(50);
      S.near(zoom("p1"), 1.2, "p1 zoom");
      S.near(zoom("h2"), 1.2, "h2 zoom");
      S.assert($("h2").getBoundingClientRect().height > h0 * 1.1, "heading did not grow");
    });

    await S.test("nested paragraphs are scaled once, not compounded", async () => {
      S.near(zoom("ul"), 1.2, "ul zoom");
      S.near(zoom("li1"), 1.2, "li zoom");
      S.near(zoom("lip"), 1.2, "p in li zoom");
    });

    await S.test("code unaffected (standalone and inside a scaled list)", async () => {
      S.near(zoom("pre"), 1, "top-level pre zoom");
      S.near(zoom("pre-in"), 1, "pre inside scaled li zoom");
      S.near(zoom("pre-in").valueOf(), zoom("pre"), "code blocks differ in size");
    });

    await S.test("composer unaffected", async () => {
      S.near(zoom("composer"), 1, "composer zoom");
      S.near(zoom("cp"), 1, "composer paragraph zoom");
    });

    await S.test("sidebar and header unaffected", async () => {
      S.near(zoom("nav-li"), 1, "sidebar item zoom");
      S.near(zoom("head-h1"), 1, "header title zoom");
    });

    await S.test("English paragraph (unmarked) unaffected", async () => {
      S.near(zoom("en"), 1, "english p zoom");
    });

    await S.test("no inline style written per paragraph", async () => {
      for (const el of document.querySelectorAll("body *")) {
        const st = el.getAttribute("style") || "";
        S.assert(!/zoom|font-size|--farsi-scale/.test(st), "inline size style on " + (el.id || el.tagName));
      }
      S.assert(root.style.getPropertyValue("--farsi-scale") === "1.2", "variable not on <html>");
    });

    await S.test("decrease via storage change (another tab / popup)", async () => {
      chrome.storage.sync.set({ fontScale: 90 });
      await S.wait(50);
      S.near(zoom("p1"), 0.9, "p1 zoom");
      S.near(zoom("pre-in"), 1, "pre inside list zoom");
    });

    await S.test("invalid stored value falls back to 100%", async () => {
      S.send({ type: "farsi-toggle", fontScale: 175 });
      await S.wait(50);
      S.near(zoom("p1"), 1, "p1 zoom");
      S.assert(!root.classList.contains("farsi-scale-on"), "scale class left on");
      S.send({ type: "farsi-toggle", fontScale: 110 });
      await S.wait(50);
      S.near(zoom("p1"), 1.1, "p1 zoom after valid value");
    });

    await S.test("site off removes font scale", async () => {
      S.send({ type: "farsi-toggle", siteOn: false });
      await S.wait(50);
      S.assert(!root.classList.contains("farsi-scale-on"), "scale class left on");
      S.assert(!root.style.getPropertyValue("--farsi-scale"), "scale variable left on");
      S.near(zoom("p1"), 1, "p1 zoom");
    });

    await S.test("changing size while off is remembered, not applied", async () => {
      S.send({ type: "farsi-toggle", fontScale: 130 });
      await S.wait(50);
      S.assert(!root.classList.contains("farsi-scale-on"), "applied while site is off");
    });

    await S.test("site on reapplies font scale", async () => {
      S.send({ type: "farsi-toggle", siteOn: true });
      await S.wait(900);
      S.assert(root.classList.contains("farsi-scale-on"), "scale class missing");
      S.near(zoom("p1"), 1.3, "p1 zoom");
      S.near(zoom("pre-in"), 1, "pre inside list zoom");
    });

    await S.test("saved override is applied before clearing", async () => {
      S.assert($("ov").getAttribute("data-farsi-rtl") === "ltr", "override not applied");
    });

    await S.test("clear overrides re-evaluates without reload", async () => {
      const syncBefore = JSON.stringify(S.sync);
      chrome.storage.local.remove("overrides");
      await S.wait(900);
      S.assert($("ov").getAttribute("data-farsi-rtl") === "rtl",
               "paragraph kept its override: " + $("ov").getAttribute("data-farsi-rtl"));
      S.assert(JSON.stringify(S.sync) === syncBefore, "sync settings changed");
    });

    await S.test("only overrides cleared: other paragraphs and settings intact", async () => {
      S.assert($("p1").getAttribute("data-farsi-rtl") === "rtl", "p1 lost its direction");
      S.assert(root.classList.contains("farsi-font-on"), "font setting lost");
      S.near(zoom("p1"), 1.3, "font scale lost");
    });

    await S.test("a flip after clearing does not resurrect old overrides", async () => {
      // Flip p1 through the real selection path.
      const r = document.createRange();
      r.selectNodeContents($("p1"));
      getSelection().removeAllRanges();
      getSelection().addRange(r);
      S.send({ type: "farsi-toggle", flip: true });
      await S.wait(700);
      const keys = Object.keys(S.local.overrides || {});
      S.assert(keys.length === 1, "expected 1 saved override, got " + keys.length);
      S.assert(!keys.includes(fnv(OV_TEXT, 200)), "cleared override was written back");
    });
  } catch (e) { S.fail(e); return; }
  S.finish();
})();
</script>
</body>
</html>
