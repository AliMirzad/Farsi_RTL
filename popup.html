<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<title>Farsi_RTL</title>
<style>
  body {
    font-family: Tahoma, Segoe UI, sans-serif;
    width: 270px;
    margin: 0;
    padding: 16px;
    background: #1f2937;
    color: #f3f4f6;
  }
  h1 { font-size: 14px; margin: 0 0 14px; text-align: center; font-weight: 600; }
  .card {
    background: #374151;
    border-radius: 10px;
    padding: 12px;
  }
  .card + .card { margin-top: 10px; }
  .caption {
    font-size: 12px;
    color: #9ca3af;
    margin-bottom: 8px;
  }
  .segmented {
    display: flex;
    background: #1f2937;
    border-radius: 8px;
    padding: 3px;
    gap: 3px;
  }
  .segmented label {
    flex: 1;
    text-align: center;
    padding: 6px 4px;
    font-size: 12px;
    border-radius: 6px;
    cursor: pointer;
    user-select: none;
    transition: background .15s, color .15s;
  }
  .segmented input { display: none; }
  .segmented input:checked + span {
    background: #10b981;
    color: white;
    display: block;
    padding: 6px 4px;
    border-radius: 6px;
    margin: -6px -4px;
  }
  .segmented label span {
    display: block;
    color: #d1d5db;
  }
  .mode-desc {
    font-size: 11px;
    color: #9ca3af;
    margin-top: 10px;
    text-align: center;
    line-height: 1.5;
    min-height: 16px;
  }
  .row {
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .label { font-size: 13px; }
  .switch { position: relative; width: 40px; height: 22px; flex-shrink: 0; }
  .switch input { opacity: 0; width: 0; height: 0; }
  .slider {
    position: absolute; inset: 0;
    background: #6b7280;
    border-radius: 22px;
    cursor: pointer;
    transition: background .2s;
  }
  .slider::before {
    content: "";
    position: absolute;
    width: 16px; height: 16px;
    right: 3px; top: 3px;
    background: white;
    border-radius: 50%;
    transition: right .2s;
  }
  input:checked + .slider { background: #10b981; }
  input:checked + .slider::before { right: 21px; }
  .credit {
    margin-top: 14px;
    font-size: 11px;
    color: #9ca3af;
    text-align: center;
    letter-spacing: .5px;
    border-top: 1px solid #374151;
    padding-top: 10px;
    direction: ltr;
    font-family: system-ui, sans-serif;
  }
</style>
</head>
<body>
  <h1>Farsi_RTL</h1>

  <div class="card">
    <div class="caption">حالت راست‌چین</div>
    <div class="segmented">
      <label>
        <input type="radio" name="rtl-mode" value="always">
        <span>همیشه</span>
      </label>
      <label>
        <input type="radio" name="rtl-mode" value="smart">
        <span>هوشمند</span>
      </label>
      <label>
        <input type="radio" name="rtl-mode" value="auto">
        <span>پیش‌فرض</span>
      </label>
    </div>
    <div class="mode-desc" id="mode-desc"></div>
  </div>

  <div class="card">
    <div class="row">
      <span class="label">فونت Vazir</span>
      <label class="switch">
        <input type="checkbox" id="toggle-font">
        <span class="slider"></span>
      </label>
    </div>
  </div>

  <div class="credit">created by Ali Mirzad</div>

  <script src="popup.js"></script>
</body>
</html>
