<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<title>Farsi_RTL</title>
<style>
  body {
    font-family: Tahoma, Segoe UI, sans-serif;
    width: 250px;
    margin: 0;
    padding: 16px;
    background: #1f2937;
    color: #f3f4f6;
  }
  h1 { font-size: 14px; margin: 0 0 12px; text-align: center; font-weight: 600; }
  .row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: #374151;
    padding: 10px 12px;
    border-radius: 8px;
  }
  .row + .row { margin-top: 8px; }
  .label { font-size: 13px; }
  .switch { position: relative; width: 40px; height: 22px; flex-shrink: 0; }
  .switch input { opacity: 0; width: 0; height: 0; }
  .slider {
    position: absolute; inset: 0;
    background: #6b7280;
    border-radius: 22px;
    cursor: pointer;
    transition: background .2s;
  }
  .slider::before {
    content: "";
    position: absolute;
    width: 16px; height: 16px;
    right: 3px; top: 3px;
    background: white;
    border-radius: 50%;
    transition: right .2s;
  }
  input:checked + .slider { background: #10b981; }
  input:checked + .slider::before { right: 21px; }
  .hint {
    margin-top: 14px;
    font-size: 12px;
    color: #d1d5db;
    text-align: center;
    line-height: 1.6;
    border-top: 1px solid #374151;
    padding-top: 10px;
  }
</style>
</head>
<body>
  <h1>Farsi_RTL</h1>

  <div class="row">
    <span class="label">راست‌چین</span>
    <label class="switch">
      <input type="checkbox" id="toggle-rtl">
      <span class="slider"></span>
    </label>
  </div>

  <div class="row">
    <span class="label">فونت Vazir</span>
    <label class="switch">
      <input type="checkbox" id="toggle-font">
      <span class="slider"></span>
    </label>
  </div>

  <div class="hint">یه قهوه مهمون نمی‌کنی؟</div>

  <script src="popup.js"></script>
</body>
</html>
